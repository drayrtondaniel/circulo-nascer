<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado · {{ client.name }}</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        :root {
            --primary: {{ client.primary_color }};
            --secondary: {{ client.secondary_color }};
        }
        
        .container {
            max-width: 600px;
            text-align: center;
            background: #111;
            border: 1px solid #222;
            padding: 60px 40px;
            border-radius: 4px;
        }
        
        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: black;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ <span class="gradient-text">OBRIGADO!</span></h1>
        <p style="font-size: 1.2rem; margin: 20px 0;">Recebemos seus dados com sucesso.</p>
        <p style="color: #888; margin-bottom: 30px;">Em breve {{ client.name }} entrará em contato.</p>
        
        <p style="font-size: 0.8rem; color: #444;">
            Protocolo: {{ lead_id[:8] }}
        </p>
        
        <a href="/?client={{ client.id }}" class="btn">VOLTAR AO INÍCIO</a>
    </div>
</body>
</html>
