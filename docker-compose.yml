# ===========================================
# DR. AYRTON - CIRCULO NASCER
# docker-compose.yml - Deploy local
# ===========================================

services:
  circulo-nascer:
    build: .
    container_name: circulo-nascer
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-circulo-nascer-secret-2026}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./data:/app/data
    networks:
      - dr-network

networks:
  dr-network:
    driver: bridge